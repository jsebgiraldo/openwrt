# Use edge-triggered IRQ compatibility for the MM6108 SPI line.
# Required on R1000 + WM6108 because the IRQ line passes through the
# PCA9535 I2C GPIO expander, whose Linux driver only supports edge
# triggers (it rejects IRQ_TYPE_LEVEL_LOW with -EINVAL). Safe on EKH01
# too: direct CM4 GPIOs support both level and edge.
options morse spi_use_edge_irq=1
